# Exploratory robustness smoke test; prefix/suffix are outside the main 2 x 2 study.
datasets: [GunPoint, ECG200, ItalyPowerDemand]
seeds: [1]
missing_rate: 0.2
missing_rates: [0.1, 0.2, 0.3]
source_patterns: [point, block, prefix, suffix]
target_patterns: [point, block, prefix, suffix]
imputers: [linear]
classifiers: [dtw, minirocket, stat_rf]
validation_size: 0.25
classifier_params:
  stat_rf_n_estimators: 100
  minirocket_n_kernels: 5000
results_dir: results/pattern_rate_smoke
