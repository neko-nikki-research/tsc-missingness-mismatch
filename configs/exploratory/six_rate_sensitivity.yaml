# Extra-rate sensitivity analysis. Do not pool with Protocol v1.0 main results.
# Adds the previously agreed 5%, 15%, and 25% conditions to the formal rates.
datasets: [GunPoint, ECG200, ItalyPowerDemand]
seeds: [1, 2, 3, 4, 5]
missing_rates: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
source_patterns: [point, block]
target_patterns: [point, block]
imputers: [linear]
classifiers: [dtw, minirocket, stat_rf]
validation_size: 0.25
classifier_params:
  stat_rf_n_estimators: 500
  minirocket_n_kernels: 10000
results_dir: results/exploratory_six_rate_sensitivity
