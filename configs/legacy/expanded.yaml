# First expanded experiment after the single GunPoint pilot succeeds.
datasets: [GunPoint]
seeds: [1, 2, 3, 4, 5]
missing_rate: 0.2
source_patterns: [point, block]
target_patterns: [point, block]
imputers: [linear]
classifiers: [dtw, minirocket, stat_rf]
validation_size: 0.25
classifier_params:
  stat_rf_n_estimators: 500
  minirocket_n_kernels: 10000
results_dir: results/expanded
