# Protocol v1.2 main study: 64 UCR2015 datasets and circular point/block PP/PB/BP/BB.
# Model selection and regret use balanced accuracy; test remains deployment-only.
datasets: [Adiac, ArrowHead, Beef, BeetleFly, BirdChicken, Car, CBF, Coffee, Computers, CricketX, CricketY, CricketZ, DiatomSizeReduction, DistalPhalanxOutlineCorrect, DistalPhalanxOutlineAgeGroup, DistalPhalanxTW, Earthquakes, ECG200, ECG5000, ECGFiveDays, FaceFour, FiftyWords, Fish, GunPoint, Ham, Haptics, Herring, InsectWingbeatSound, ItalyPowerDemand, LargeKitchenAppliances, Lightning2, Lightning7, Meat, MedicalImages, MiddlePhalanxOutlineCorrect, MiddlePhalanxOutlineAgeGroup, MiddlePhalanxTW, MoteStrain, OliveOil, OSULeaf, PhalangesOutlinesCorrect, Plane, ProximalPhalanxOutlineCorrect, ProximalPhalanxOutlineAgeGroup, ProximalPhalanxTW, RefrigerationDevices, ScreenType, ShapeletSim, ShapesAll, SmallKitchenAppliances, SonyAIBORobotSurface1, SonyAIBORobotSurface2, Strawberry, SwedishLeaf, Symbols, SyntheticControl, ToeSegmentation1, ToeSegmentation2, Trace, TwoLeadECG, Wine, WordSynonyms, Worms, WormsTwoClass]
seeds: [1, 2, 3, 4, 5]
missing_rates: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
source_patterns: [point, block]
target_patterns: [point, block]
imputers: [linear]
classifiers: [dtw, minirocket, stat_rf]
validation_size: 0.25
classifier_params:
  stat_rf_n_estimators: 500
  minirocket_n_kernels: 10000
results_dir: results/main_protocol_ucr64_v1_2
